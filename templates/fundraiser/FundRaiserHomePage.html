<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fundraiser Dashboard</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
</head>

<body>

<!-- TOP BAR -->
<div class="topbar">
    <span class="topbar-logo">Online Fundraising System — Fund Raiser Portal</span>

    <div class="topbar-user">
        <span>Fund Raiser</span>
        <div class="avatar">FR</div>
    </div>
</div>

<div class="layout">

    <!-- SIDEBAR -->
    <div class="sidebar">
        <a href="/fundraiser/homepage" class="nav-item active">Dashboard</a>
        <a href="/fundraiser/history" class="nav-item">History</a>
        <a href="/user/logout" class="nav-item logout">Log Out</a>
    </div>

    <!-- MAIN -->
    <div class="main">

        <div class="page-title">My Fundraising Activities</div>
        <div class="page-sub">All your FRA campaigns</div>

        <!-- TOOLBAR -->
        <div class="toolbar" style="display:flex; justify-content:space-between; align-items:center;">

            <!-- SEARCH -->
            <div class="search-group">
                <input type="text" id="searchInput" placeholder="Search FRA title..."
                       onkeydown="if(event.key==='Enter') searchFRA()">
                <button onclick="searchFRA()" class="btn-primary">Search</button>
            </div>

            <!-- CREATE BUTTON -->
            <a href="/fundraiser/create" class="btn-primary">
                + Create FRA
            </a>

        </div>

        <!-- LOADING STATE -->
        <div id="loading-state" class="empty-state">
            <div class="empty-text">Loading fundraising activities...</div>
        </div>

        <!-- NO RESULTS STATE -->
        <div id="no-result-state" class="empty-state" style="display:none;">
            <div class="empty-text" id="no-result-msg">No FRA found.</div>
        </div>

        <!-- GRID -->
        <div class="grid" id="fra-container" style="display:none;"></div>

    </div>
</div>

</body>
</html>

<script>
function suspendFRA(fraId) {
    fetch(`/fundraiser/suspend/${fraId}`, {
        method: 'POST'
    })
    .then(res => res.json())
    .then(data => {

        alert(data.message);

        if (data.success) {
            location.reload();
        }
    })
    .catch(err => {
        console.error(err);
        alert("Suspend failed");
    });
}

function searchFRA() {
    const name = document.getElementById('searchInput').value.trim();

    document.getElementById('loading-state').style.display   = 'flex';
    document.getElementById('no-result-state').style.display = 'none';
    document.getElementById('fra-container').style.display   = 'none';

    fetch('/fundraiser/search', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name })
    })
    .then(res => res.json())
    .then(data => {
        document.getElementById('loading-state').style.display = 'none';

        if (!data.data || data.data.length === 0) {
            document.getElementById('no-result-msg').textContent = data.message;
            document.getElementById('no-result-state').style.display = 'flex';
            return;
        }

        renderFRACards(data.data);
    })
    .catch(err => {
        console.error(err);
        document.getElementById('loading-state').style.display = 'none';
        document.getElementById('no-result-msg').textContent = 'Failed to load fundraising activities. Please try again.';
        document.getElementById('no-result-state').style.display = 'flex';
    });
}

function renderFRACards(fras) {
    const container = document.getElementById('fra-container');
    container.innerHTML = '';

    fras.forEach(fra => {
        container.innerHTML += `
        <div class="profile-card">
            <div class="card-top">
                <div class="icon-circle icon-fr">
                    ${esc(fra.title.substring(0, 2).toUpperCase())}
                </div>
                <div>
                    <div class="card-name">${esc(fra.title)}</div>
                    <div style="font-size:12px; color:grey; margin-top:2px;">${esc(fra.description)}</div>
                </div>
            </div>
            <div class="card-actions">
                <button class="act-btn view"
                    onclick="window.location.href='/fundraiser/view/${esc(fra.fraId)}'">
                    View
                </button>
                <button class="act-btn"
                    onclick="window.location.href='/fundraiser/update/${esc(fra.fraId)}'">
                    Update
                </button>
                <button class="act-btn"
                    onclick="suspendFRA('${esc(fra.fraId)}')"
                    style="color:red; border:1px solid red;">
                    Suspend
                </button>
                <button class="act-btn" onclick="window.location.href='/fundraiser/viewCount/${esc(fra.fraId)}'">
                    View Count
                </button>
                <button class="act-btn" onclick="viewFRAShortlistCount('${esc(fra.fraId)}')">
                    Shortlist Count
                </button>
            </div>
        </div>
        `;
    });

    container.style.display = 'grid';
}

function esc(str) {
    const d = document.createElement('div');
    d.appendChild(document.createTextNode(String(str)));
    return d.innerHTML;
}


window.onload = () => searchFRA();

function viewFRAShortlistCount(fraId) {
    fetch(`/fundraiser/shortlistCount/${fraId}`)
    .then(res => res.json())
    .then(data => {
        if (data.success) {
            alert(`FRA has been shortlisted ${data.shortlist_count} times.`);
        } else {
            alert(data.message || "Failed to retrieve shortlist count");
        }
    })
    .catch(err => {
        console.error(err);
        alert("Failed to retrieve shortlist count");
    });
}
</script>
