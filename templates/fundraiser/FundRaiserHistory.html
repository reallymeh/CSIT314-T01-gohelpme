<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fundraiser Dashboard</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
    <style>
        .filter-bar {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            align-items: flex-end;
            background: #fff;
            border: 1px solid #e0e0e0;
            border-radius: 10px;
            padding: 16px 20px;
            margin-bottom: 20px;
            width: 100%;
        }
        .filter-group { display:flex; flex-direction:column; gap:4px; }
        .filter-group label { font-size:12px; color:#666; font-weight:600; }
        .filter-group select,
        .filter-group input[type="date"] {
            padding: 8px 12px;
            font-size: 13px;
            border: 1px solid #ccc;
            border-radius: 6px;
            background: #fff;
            color: #1a1a1a;
        }
        .filter-group select:focus,
        .filter-group input[type="date"]:focus { outline:none; border-color:#378ADD; }

        .toolbar {
            display:flex; 
            justify-content:space-between; 
            align-items:center;
            width: 100%;
        }
    </style>
</head>

<body>

<!-- TOP BAR -->
<div class="topbar">
    <span class="topbar-logo">Online Fundraising System — Fund Raiser Portal</span>

    <div class="topbar-user">
        <span>Fund Raiser</span>
        <div class="avatar">FR</div>
    </div>
</div>

<div class="layout">

    <!-- SIDEBAR -->
    <div class="sidebar">
        <a href="/fundraiser/homepage" class="nav-item">Dashboard</a>
        <a href="/fundraiser/history" class="nav-item active">History</a>
        <a href="/user/logout" class="nav-item logout">Log Out</a>
    </div>

    <!-- MAIN -->
    <div class="main">

        <div class="page-title">Completed FRA Campaigns</div>
        <div class="page-sub">All your completed FRA campaigns</div>

        <!-- TOOLBAR -->
        <div class="toolbar">

            <!-- SEARCH -->
            <div class="filter-bar">
            <!-- Category filter (US6) -->
            <div class="filter-group">
                <label>FRA Category</label>
                <select id="filterCategory">
                    <option value="">All Categories</option>
                    {% for cat in categories %}
                        <option value="{{ cat }}">{{ cat }}</option>
                    {% endfor %}
                </select>
            </div>

            <!-- Date-from filter (US6) -->
            <div class="filter-group">
                <label>Date From</label>
                <input type="date" id="filterDateFrom">
            </div>

            <!-- Date-to filter (US6) -->
            <div class="filter-group">
                <label>Date To</label>
                <input type="date" id="filterDateTo">
            </div>

            <div class="filter-group" style="justify-content: center;">
                <label>&nbsp;</label>
                <div style="display:flex;gap:8px;justify-content: center;">
                    <button class="btn-primary" onclick="searchHistory()">Search</button>
                    <button class="btn-primary"     onclick="clearFilters()">Clear</button>
                </div>
            </div>
        </div>
        
        </div>
         <!-- NO RESULTS -->
        <div id="no-result-state" class="empty-state" style="display:none;">
            <div class="empty-text" id="no-result-msg">No donation records found.</div>
        </div>
        <!-- GRID -->
        <div class="grid" id="fra-container">

            {% for fra in fra_data %}

            <div class="profile-card">

                <!-- TOP -->
                <div class="card-top">
                    <div class="icon-circle icon-fr">
                        {{ fra.title[:2] | upper }}
                    </div>

                    <div>
                        <div class="card-name">{{ fra.title }}</div>

                        <!-- GREY DESCRIPTION -->
                        <div style="font-size:12px; color:grey; margin-top:2px;">
                            {{ fra.description }}
                        </div>
                    </div>
                </div>

                <!-- ACTIONS -->
                <div class="card-actions">

                    <button class="act-btn view" onclick="window.location.href='/fundraiser/viewCompleted/{{ fra.fraId }}'">
                    View
                    </button>
                </div>
            </div>
            {% endfor %}

        </div>

    </div>
</div>

</body>
<script>
    function searchHistory() {
    const category  = document.getElementById('filterCategory').value;
    const date_from = document.getElementById('filterDateFrom').value;
    const date_to   = document.getElementById('filterDateTo').value;

    fetch('/fundraiser/history/search', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ category, date_from, date_to })
    })
    .then(res => res.json())
    .then(data => {

        const container = document.getElementById('fra-container');
        const msgEl = document.getElementById('no-result-msg');
        const stateEl = document.getElementById('no-result-state');

        container.innerHTML = '';
        if (stateEl) stateEl.style.display = 'none';

        if (!data.data || data.data.length === 0) {
            if (msgEl && stateEl) {
                msgEl.textContent = data.message || "No results found";
                stateEl.style.display = 'block';
            }
            return;
        }

        renderGrid(data.data);
    })
    .catch(err => { 
        console.error(err); 
        alert('Failed to load history. Please try again.'); 
    });
}
    
    function clearFilters() {
    document.getElementById('filterCategory').value  = '';
    document.getElementById('filterDateFrom').value  = '';
    document.getElementById('filterDateTo').value    = '';

    const stateEl = document.getElementById('no-result-state');
    if (stateEl) stateEl.style.display = 'none';

    fetch('/fundraiser/history/search', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ category: '', date_from: '', date_to: '' })
    })
    .then(res => res.json())
    .then(data => { if (data.data) renderGrid(data.data); });
   }

   function renderGrid(records) {
    const container = document.getElementById('fra-container');
    container.innerHTML = '';

    records.forEach(fra => {
        container.innerHTML += `
        <div class="profile-card">
            <div class="card-top">
                <div class="icon-circle icon-fr">
                    ${fra.title.substring(0,2).toUpperCase()}
                </div>
                <div>
                    <div class="card-name">${fra.title}</div>
                    <div style="font-size:12px; color:grey;">
                        ${fra.description}
                    </div>
                </div>
            </div>

            <div class="card-actions">
                <button class="act-btn view"
                    onclick="window.location.href='/fundraiser/viewCompleted/${fra.fraId}'">
                    View
                </button>
            </div>
        </div>`;
    });
}

</script>
</html>
